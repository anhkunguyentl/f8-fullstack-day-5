<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/form.css">
</head>
<body>
    <div class="wrapper">
        <div class="form-register">
            <h1>Register</h1>
        </div>
        <div class="form-container">
            <form action="" autocomplete="off">
                <div class="form-content">
                    <label for="displayname">Display Name</label>
                    <input type="text" name="Display Name" id="displayname" placeholder="Tên hiển thị (có thể là biệt danh, hoặc tên thật....)">
                </div>
                <div class="form-content">
                    <label for="email">Email</label>
                    <input type="email" name="email" id="email" placeholder="Địa chỉ email dùng để đăng nhập và nhận thông báo" >
                </div>
                <div class="form-content">
                    <label for="phonenumber">Phone Number</label>
                    <input type="tel" name="Phone Number" id="phonenumber" placeholder="Số điện thoại để liên hệ hoặc xác minh tài khoản">
                </div>
                <div class="form-content">
                    <label for="password">Password</label>
                    <input type="password" name="password" id="password" placeholder="Mật khẩu bảo vệ tài khoản, nên đủ mạnh">
                </div>
                <div class="form-content">
                    <label for="confirmpassword">Confirm Password</label>
                    <input type="password" name="Confirm Password" id="confirmpassword" placeholder="Nhập lại mật khẩu ở trên để xác nhận">
                </div>
                <div class="form-content">
                    <div class="gender-group">
                        <label>Gender</label>
                            <div class="radio-options">
                                <label for="male">Male</label>
                                <input type="radio" name="Gender" id="male">
                                <label for="female">Female</label>
                                <input type="radio" name="Gender" id="female">
                                <label for="other">Other</label>
                                <input type="radio" name="Gender" id="other">
                            </div>
                        
                    </div>
                </div>
                <div class="form-content">
                    <label for="dateofbirth">Date Of Birth</label>
                    <input type="date" name="Date Of Birth" id="dateofbirth">
                </div>
                <div class="form-content">
                    <label for="address">Address</label>
                    <input type="text" name="Address" id="address" placeholder="Địa chỉ hiện tại ">
                </div>
                <div class="form-content">
                    <div class="img-upload">
                        <label for="profilepicture">
                            <p>Profile Picture <span style="color:black; font-size:16px">(Nhấn vào đây hoặc avatar bên dưới để thay đổi ảnh đại diện)</span></p>
                        
                            <img src="./image/img-placeholder.png" alt="avatar">
                        </label>
                        <input type="file" name="Profile Picture" id="profilepicture" accept="image/*">
                    </div>
                </div>
                <div class="form-content">
                    <div class="email-group">
                        <label>Communication Preferences</label>
                        <div class="email-options">
                            <label for="subscribe">
                                <input type="checkbox" name="Communication Preferences" id="subscribe">
                                Subscribe to Newsletter (Nhận bản tin định kỳ)
                            </label>
    
                            <label for="receive">
                                <input type="checkbox" name="Communication Preferences" id="receive">
                                Receive Promotional Emails (Nhận thông tin khuyến mãi)
                            </label>
    
                            <label for="get">
                                <input type="checkbox" name="Communication Preferences" id="get">
                                 Get Product Updates (Nhận cập nhật sản phẩm mới)
                            </label>
                        </div>
                    </div>
                    
                </div>
                <button type="submit">REGISTER</button>
            </form>

        </div>
    </div>
</body>
</html>
